<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sync engine — pull · push · conflicts</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #F4F9F7;
      --color-ink:     #122b26;
      --color-muted:   #47615b;
      --color-soft:    #5b7670;
      --color-accent:  #006b5f;
      --color-link:    #04574d;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
    .ref { font-family: var(--font-mono); font-size: 0.8rem; color: var(--color-muted); margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Sync</p>
    <h1>Offline sync: deltas down, batches up</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mod-sync-title mod-sync-desc">
        <title id="mod-sync-title">Sync engine pull push conflicts</title>
        <desc id="mod-sync-desc">The mobile client pulls deltas and pushes version-checked batches; mismatches become conflicts, everything lands in Postgres.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#47615b"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#006b5f"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#04574d"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#F4F9F7"/>

        <rect x="16" y="64" width="928" height="336" rx="8" fill="rgba(18,43,38,0.02)" stroke="rgba(18,43,38,0.10)" stroke-width="0.8"/>
        <rect x="28" y="68" width="108" height="12" rx="2" fill="#F4F9F7"/>
        <text x="82" y="77" fill="#5b7670" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SYNC ENGINE</text>

        <!-- arrows -->
        <path d="M 100,220 V 155 H 252" fill="none" stroke="#04574d" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="108" y="182" width="36" height="14" fill="#F4F9F7"/>
        <text x="126" y="192" fill="#04574d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PULL</text>
        <path d="M 100,316 V 345 H 252" fill="none" stroke="#04574d" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="108" y="330" width="36" height="14" fill="#F4F9F7"/>
        <text x="126" y="340" fill="#04574d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PUSH</text>
        <line x1="432" y1="345" x2="500" y2="345" stroke="#47615b" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="446" y="322" width="68" height="14" fill="#F4F9F7"/>
        <text x="480" y="332" fill="#47615b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MISMATCH</text>
        <line x1="432" y1="155" x2="540" y2="155" stroke="#47615b" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="468" y="132" width="44" height="14" fill="#F4F9F7"/>
        <text x="490" y="142" fill="#47615b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DELTA</text>
        <path d="M 340,390 V 402 Q 340,410 348,410 H 692 Q 700,410 700,402 V 200" fill="none" stroke="#47615b" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="708" y="262" width="44" height="14" fill="#F4F9F7"/>
        <text x="730" y="272" fill="#47615b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APPLY</text>

        <!-- mobile -->
        <rect x="16" y="220" width="150" height="96" rx="6" fill="rgba(18,43,38,0.03)" stroke="rgba(18,43,38,0.30)" stroke-width="1"/>
        <rect x="24" y="226" width="58" height="12" rx="2" fill="none" stroke="#47615b" stroke-width="0.8"/>
        <text x="53" y="235" fill="#47615b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLIENT</text>
        <text x="91" y="264" fill="#122b26" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mobile app</text>
        <text x="91" y="282" fill="#47615b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">WatermelonDB</text>
        <text x="91" y="298" fill="#47615b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">since cursor</text>
        <!-- pull -->
        <rect x="252" y="110" width="180" height="90" rx="6" fill="#ffffff" stroke="#122b26" stroke-width="1"/>
        <rect x="260" y="116" width="36" height="12" rx="2" fill="none" stroke="#47615b" stroke-width="0.8"/>
        <text x="278" y="125" fill="#47615b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PULL</text>
        <text x="342" y="152" fill="#122b26" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Delta pull</text>
        <text x="342" y="170" fill="#47615b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">capped · ordered</text>
        <text x="342" y="186" fill="#47615b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tombstones</text>
        <!-- push focal -->
        <rect x="252" y="300" width="180" height="90" rx="6" fill="rgba(0,107,95,0.08)" stroke="#006b5f" stroke-width="1.2"/>
        <rect x="260" y="306" width="36" height="12" rx="2" fill="none" stroke="#006b5f" stroke-width="0.8"/>
        <text x="278" y="315" fill="#006b5f" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PUSH</text>
        <text x="342" y="342" fill="#006b5f" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Batch push</text>
        <text x="342" y="360" fill="#47615b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FK order · versions</text>
        <text x="342" y="376" fill="#47615b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">side effects</text>
        <!-- conflicts -->
        <rect x="500" y="300" width="180" height="90" rx="6" fill="#ffffff" stroke="#122b26" stroke-width="1"/>
        <rect x="508" y="306" width="56" height="12" rx="2" fill="none" stroke="#47615b" stroke-width="0.8"/>
        <text x="536" y="315" fill="#47615b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CONFLICT</text>
        <text x="590" y="342" fill="#122b26" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Conflicts</text>
        <text x="590" y="360" fill="#47615b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">client vs server</text>
        <text x="590" y="376" fill="#47615b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">resolve both ways</text>
        <!-- postgres -->
        <rect x="500" y="110" width="280" height="90" rx="6" fill="rgba(18,43,38,0.05)" stroke="#47615b" stroke-width="1"/>
        <rect x="508" y="116" width="22" height="12" rx="2" fill="none" stroke="#47615b" stroke-width="0.8"/>
        <text x="519" y="125" fill="#47615b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DB</text>
        <text x="640" y="152" fill="#122b26" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Postgres</text>
        <text x="640" y="170" fill="#47615b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">14 synced tables</text>
        <text x="640" y="186" fill="#47615b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">allow-listed columns</text>

        <!-- legend -->
        <line x1="16" y1="540" x2="944" y2="540" stroke="rgba(18,43,38,0.12)" stroke-width="0.8"/>
        <rect x="16" y="552" width="14" height="14" rx="3" fill="rgba(0,107,95,0.08)" stroke="#006b5f" stroke-width="1.2"/>
        <text x="36" y="563" fill="#47615b" font-size="9" font-family="'Geist Mono', monospace">version-checked push — focal</text>
        <line x1="288" y1="559" x2="318" y2="559" stroke="#04574d" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="324" y="563" fill="#47615b" font-size="9" font-family="'Geist Mono', monospace">client sync</text>
        <line x1="440" y1="559" x2="470" y2="559" stroke="#47615b" stroke-width="1" marker-end="url(#arrow)"/>
        <text x="476" y="563" fill="#47615b" font-size="9" font-family="'Geist Mono', monospace">apply / resolve</text>
      </svg>
    </div>
    <p class="ref">Full function catalog: Agents_Documents/backend-modules/sync.md</p>
  </div>
</body>
</html>
