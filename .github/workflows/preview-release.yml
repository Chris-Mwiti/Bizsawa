# Preview release — build, upload to Drive, update website
#
# Manual pipeline (v1, pre-Play-Store): builds a preview APK on EAS,
# uploads it to the shared Google Drive folder, then rewrites
# web/src/download.json so the site's Download section serves it.
#
# Required secrets (repo Settings → Secrets → Actions):
#   EXPO_TOKEN        – Expo access token (EAS builds + updates)
#   GDRIVE_SA_JSON    – service-account JSON key; the Drive folder must be
#                       shared with this account's email (Editor), and the
#                       folder itself set to "Anyone with the link: Viewer"
#                       so APKs inherit public link access.
#   GDRIVE_FOLDER_ID  – the Drive folder ID for preview APKs.
#
# Run: Actions → "Preview release" → Run workflow → enter version (e.g. 1.1.0).

name: Preview release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.1.0)"
        required: true
        default: "1.0.0"
      notes:
        description: "Release notes (one line)"
        required: false
        default: "Stable preview build."

jobs:
  preview-release:
    name: build + upload + publish manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        # Secrets arrive via env (never interpolated into the script text:
        # the JSON key's own quotes would break shell quoting otherwise).
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          missing=""
          [ -z "$EXPO_TOKEN" ] && missing="$missing EXPO_TOKEN"
          [ -z "$GDRIVE_SA_JSON" ] && missing="$missing GDRIVE_SA_JSON"
          [ -z "$GDRIVE_FOLDER_ID" ] && missing="$missing GDRIVE_FOLDER_ID"
          if [ -n "$missing" ]; then echo "Missing secrets:$missing — see workflow header docs"; exit 1; fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Bump app version
        run: bun scripts/bump-version.js "${{ inputs.version }}"

      - name: EAS preview build (apk, waits for completion)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --wait

      - name: Download build artifact
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          URL=$(eas build:list --platform android --distribution internal --channel preview --status finished --limit 1 --json --non-interactive | python3 -c "import sys,json; d=json.load(sys.stdin); b=d[0] if isinstance(d,list) else d; print(((b.get('artifacts') or {}).get('buildUrl')) or b.get('artifactUrl') or '')")
          if [ -z "$URL" ]; then echo "no finished preview build found"; exit 1; fi
          curl -fL -H "Authorization: Bearer $EXPO_TOKEN" -o bizsawa-preview.apk "$URL"

      - name: Upload to Drive
        id: drive
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_FILE: /tmp/sa.json
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          printf '%s' "$GDRIVE_SA_JSON" > /tmp/sa.json
          # Fail fast with a safe diagnostic (key names only, never values):
          # a mangled paste (lost quotes, reflowed text) breaks the upload
          # later with a cryptic oauth error.
          python3 -c "import json; d=json.load(open('/tmp/sa.json')); assert d.get('type')=='service_account', 'not a service-account key (type=%r)' % (d.get('type'),); print('service-account JSON OK, project:', d.get('project_id'))"
          # Folder IDs copy-pasted from the URL often carry whitespace —
          # Drive answers those with a bare 404, so scrub first.
          export RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID="$(printf '%s' "$RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID" | tr -d '[:space:]')"
          if ! command -v rclone >/dev/null; then
            if ! curl -s https://rclone.org/install.sh | sudo bash; then
              sudo apt-get update -qq && sudo apt-get install -y -qq rclone
            fi
          fi
          APK="bizsawa-preview-v${{ inputs.version }}.apk"
          cp ./bizsawa-preview.apk "./$APK"
          rclone copy "./$APK" gdrive: -v || { echo "HINT: Drive returned 404 — the folder is not shared with the service account as Editor, or GDRIVE_FOLDER_ID is wrong. See pipeline doc §2."; exit 1; }
          FILE_ID=$(rclone lsf gdrive: --files-only --format i --include "$APK" | head -1)
          if [ -z "$FILE_ID" ]; then echo "upload finished but the file is not visible — check folder sharing"; exit 1; fi
          echo "file_id=$FILE_ID" >> "$GITHUB_OUTPUT"
          rm -f /tmp/sa.json

      - name: Update website manifest
        env:
          FILE_ID: ${{ steps.drive.outputs.file_id }}
        run: |
          SIZE_MB=$(python3 -c "import os; print(f'{os.path.getsize(\"bizsawa-preview.apk\")/1048576:.1f}')")
          TODAY=$(date +%F)
          bun scripts/update-manifest.js "${{ inputs.version }}" \
            "https://drive.google.com/uc?export=download&id=$FILE_ID" \
            "$SIZE_MB" "$TODAY" "${{ inputs.notes }}"

      - name: Commit version + manifest
        run: |
          git config user.name "bizsawa-release-bot"
          git config user.email "release@bizsawa.local"
          git add app.json ../web/src/download.json
          git commit -m "release: preview v${{ inputs.version }} (apk + manifest)" || echo "nothing to commit"
          git push
