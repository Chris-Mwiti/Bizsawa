# yaml-language-server: $schema=https://unpkg.com/@powersync/cli-schemas@latest/json-schema/service-config.json
#
# PowerSync Service — production.
#
# Option A client auth: the Go API mints short-lived HS256 tokens via
# POST /api/v1/powersync/token and PowerSync verifies them with the shared
# base64url key in POWERSYNC_JWT_SIGNING_KEY / PS_JWT_SIGNING_KEY.
# Set POWERSYNC_API_TOKEN to a strong random value.
#
# For Supabase (or any external Postgres), override POWERSYNC_DATA_* and
# POWERSYNC_STORAGE_* in the production env file. Otherwise the compose
# Postgres is used.

_type: self-hosted

telemetry:
  disable_telemetry_sharing: true

replication:
  connections:
    - type: postgresql
      hostname: !env PS_DATA_HOST
      port: !env PS_DATA_PORT
      database: !env PS_DATA_DB
      username: !env PS_DATA_USER
      password: !env PS_DATA_PASSWORD
      sslmode: !env PS_DATA_SSLMODE

storage:
  type: postgresql
  hostname: !env PS_STORAGE_HOST
  port: !env PS_STORAGE_PORT
  database: !env PS_STORAGE_DB
  username: !env PS_STORAGE_USER
  password: !env PS_STORAGE_PASSWORD
  sslmode: !env PS_STORAGE_SSLMODE

port: !env PS_PORT

sync_config:
  path: sync-config.yaml

client_auth:
  jwks:
    keys:
      - kty: oct
        alg: HS256
        kid: powersync-prod
        k: !env PS_JWT_SIGNING_KEY
  audience: ["powersync"]

api:
  tokens:
    - !env PS_API_TOKEN
