# OpenTelemetry Collector config for BizSawa - local dev / load-test observability
# Traces -> Jaeger, Metrics -> Prometheus, Logs -> stdout (and optionally Loki)
receivers:
  otlp:
    protocols:
      http:
        # Render Web Service must listen on $PORT (10000) — fallback 4318 for local docker-compose
        endpoint: 0.0.0.0:${env:PORT:-4318}
      grpc:
        endpoint: 0.0.0.0:4317

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

processors:
  batch:
    timeout: 2s
    send_batch_size: 512
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  resourcedetection:
    detectors: [env, system]
  attributes:
    actions:
      - key: service.instance.id
        action: upsert
        value: ${env:HOSTNAME}

exporters:
  # Honeycomb — the real telemetry store. The api container's
  # OTEL_EXPORTER_OTLP_ENDPOINT is pinned to this collector by docker-compose.yml,
  # so this is the only hop that can reach Honeycomb.
  # endpoint is host:port; the exporter already appends the per-signal path
  # (/v1/traces, /v1/metrics) that Honeycomb ingests on.
  # Omitting x-honeycomb-dataset makes Honeycomb derive the dataset from
  # service.name, which keeps traces and metrics in separate datasets.
  otlp/honeycomb:
    endpoint: api.honeycomb.io:443
    headers:
      x-honeycomb-team: ${env:HONEYCOMB_API_KEY}
  # Traces -> Jaeger (all-in-one) OTLP endpoint
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  # Metrics -> Prometheus remote-write or keep in collector's own prometheus exporter
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true
  debug:
    verbosity: basic
  # Fallback: log to stdout for dev visibility (logging exporter deprecated → use debug)
  # logging: removed, use debug instead

connectors:
  # spanmetrics connector generates RED metrics (request, error, duration) from traces
  # Useful for Kiali/Grafana and load-test error-rate dashboards without separate metrics instrumentation
  spanmetrics:
    namespace: traces.spanmetrics

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resourcedetection, attributes]
      exporters: [otlp/jaeger, otlp/honeycomb, spanmetrics, debug]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [debug, prometheusremotewrite, otlp/honeycomb]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: '0.0.0.0'
                port: 8888
