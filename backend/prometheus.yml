global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'bizsawa-api'
    static_configs:
      - targets: ['api:9464', 'api:5504']
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: 'bizsawa-mcp'
    static_configs:
      - targets: ['mcp:5574']
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']
    scrape_interval: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
