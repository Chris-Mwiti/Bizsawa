openapi: 3.1.0
info:
  title: BizSawa Backend API
  version: 0.1.0
  description: >
    OpenAPI contract for the BizSawa Go backend.
    It is intended for product learning, API mocking, and test fixture generation.

    Conventions:
    - `Authorization: Bearer <token>` is required for protected routes.
    - Business-scoped routes accept tenant context from the `businessID` path param, JWT claims, or `X-Business-ID`.
    - Mutating requests may accept `X-Idempotency-Key`; it is required for payment initiation.
    - List endpoints use `limit` and `offset` query parameters.
    - Date range filters use RFC3339 timestamps.
    - Money and decimal values are serialized as JSON strings by `shopspring/decimal`.
servers:
  - url: http://localhost:5504
    description: Local development server
tags:
  - name: Health
  - name: Auth
  - name: Tenancy
  - name: Business
  - name: Users
  - name: Products
  - name: Customers
  - name: Taxes
  - name: Inventory
  - name: Orders
  - name: Sales
  - name: Expenses
  - name: Invoices
  - name: Payments
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
  /ready:
    get:
      tags: [Health]
      summary: Readiness check
      security: []
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example:
                status: ready
        "503":
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example:
                status: not_ready
  /api/v1/status:
    get:
      tags: [Health]
      summary: API status
      security: []
      responses:
        "200":
          description: API status payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiStatusResponse"
              example:
                service: bizsawa-api
                phase: invoices-payments
  /api/v1/public/plans:
    get:
      tags: [Tenancy]
      summary: List available subscription plans
      security: []
      responses:
        "200":
          description: Available plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
              example:
                - code: free
                  name: Free
                  maxBusinesses: 1
                  aiAccess: false
                  reports: basic
                  apiAccess: false
                - code: premium
                  name: Premium
                  maxBusinesses: 5
                  aiAccess: true
                  reports: full
                  apiAccess: true
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: owner@example.com
              password: secret123
      responses:
        "201":
          description: Authentication tokens for the newly created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                userId: 2b1a4ad8-4e77-4f1c-9d59-bd8c2a7d2d71
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                refreshToken: rt_123456789
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: owner@example.com
              password: secret123
              businessId: 2b1a4ad8-4e77-4f1c-9d59-bd8c2a7d2d72
      responses:
        "200":
          description: Authentication tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                userId: 2b1a4ad8-4e77-4f1c-9d59-bd8c2a7d2d71
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                refreshToken: rt_123456789
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
            example:
              refreshToken: rt_123456789
      responses:
        "200":
          description: Refreshed authentication tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/subscriptions/subscription:
