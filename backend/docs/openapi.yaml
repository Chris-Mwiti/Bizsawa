components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    BusinessIDPath:
      name: businessID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IDPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MemberIDPath:
      name: memberID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    From:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
    IdempotencyKeyOptional:
      name: X-Idempotency-Key
      in: header
      required: false
      schema:
        type: string
    IdempotencyKeyRequired:
      name: X-Idempotency-Key
      in: header
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unprocessable:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    ReadinessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ready
    ApiStatusResponse:
      type: object
      required: [service, phase]
      properties:
        service:
          type: string
        phase:
          type: string
    DeletionResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: deleted
    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
    GenerateDescriptionResponse:
      type: object
      required: [description]
      properties:
        description:
          type: string
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        businessId:
          type: string
          format: uuid
          nullable: true
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    AuthResponse:
      type: object
      required: [userId, accessToken, refreshToken]
      properties:
        userId:
          type: string
          format: uuid
        accessToken:
          type: string
        refreshToken:
          type: string
    Subscription:
      type: object
      required: [id, userId, planCode, status, startedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        planCode:
          type: string
          enum: [free, premium, enterprise]
        status:
          type: string
        startedAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
