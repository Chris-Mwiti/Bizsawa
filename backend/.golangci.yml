# Bizworth backend lint & format — readability focused
# golangci-lint v2 config (requires `version: "2"`; v1 cannot parse this file
# and its toolchain predates go.mod's `go 1.25.0`).
# Each struct field on new line when multiline, blank lines between stages

version: "2"

run:
  timeout: 2m

linters:
  enable:
    - gocritic
    - godot
    - govet
    - ineffassign
    - lll
    - misspell
    - revive
    - staticcheck
    - whitespace
    - wsl
  settings:
    lll:
      line-length: 130
      tab-width: 4
    wsl:
      # Enforce blank lines between stages of execution
      allow-assign-and-call: false
      allow-multiline-assign: false
      force-short-decl-cuddling: false
    whitespace:
      multi-if: false
      multi-func: false
    gocritic:
      enabled-checks:
        - paramTypeCombine
        - singleCaseSwitch
    revive:
      rules:
        - name: var-naming
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      - path: "_test\\.go"
        linters:
          - lll
          - godot

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/Codecx-Org/FinAI/backend

severity:
  default: warning
