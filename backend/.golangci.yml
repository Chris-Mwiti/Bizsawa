# Bizworth backend lint & format — readability focused
# golangci-lint v2 config (requires `version: "2"`; v1 cannot parse this file
# and its toolchain predates go.mod's `go 1.25.0`).
# Each struct field on new line when multiline, blank lines between stages

version: "2"

run:
  timeout: 2m

output:
  sort-results: true

linters:
  enable:
    - gocritic
    - godot
    - govet
    - ineffassign
    - lll
    - misspell
    - revive
    - staticcheck
    - whitespace
    - wsl
  settings:
    lll:
      line-length: 130
      tab-width: 4
    wsl:
      # Enforce blank lines between stages of execution
      strict-whitespace: true
      allow-assign-and-call: false
      allow-multiline-assign: false
      force-early-return: true
      force-short-decl-cuddling: false
    whitespace:
      multi-if: false
      multi-func: false
    gocritic:
      enabled-checks:
        - paramTypeCombine
        - singleCaseSwitch
    revive:
      rules:
        - name: var-naming
        - name: package-comments
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes: github.com/Codecx-Org/FinAI/backend

issues:
  exclude-rules:
    - path: "_test\\.go"
      linters:
        - lll
        - godot

severity:
  default-severity: warning
